<html lang="en">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>OctaneOS V2.1 | Telemetry Diagnostic Console</title>
    <style>
:root{--bg:#07120f;--panel:#0d1c18;--panel2:#10251f;--line:#254139;--text:#e7f2ec;--muted:#8fa89e;--green:#62e9ae;--amber:#ffbd62;--red:#ff7676;--blue:#6cb8ff;--shadow:0 18px 48px rgba(0,0,0,.24)}*{box-sizing:border-box}body{margin:0;background:#07120f;color:var(--text);font:14px Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}.app-shell{display:flex;min-height:100vh}.sidebar{width:252px;border-right:1px solid var(--line);background:#07120f;padding:28px 16px 18px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}.brand{display:flex;gap:10px;color:var(--text);text-decoration:none;padding:0 10px 31px;align-items:center}.brand-mark{display:grid;place-items:center;width:35px;height:35px;border:1px solid var(--green);color:var(--green);font-size:24px;border-radius:8px}.brand strong{letter-spacing:0;font-size:17px}.brand em{color:var(--green);font-size:17px;font-style:normal}.brand small{display:block;color:var(--muted);font-size:9px;letter-spacing:0;margin-top:3px}.main-nav{display:grid;gap:6px}.nav-link{border:0;background:transparent;color:var(--muted);font:inherit;text-align:left;padding:12px 12px;border-radius:8px;cursor:pointer}.nav-link span{font-size:18px;margin-right:10px;color:#7a968b}.nav-link:hover,.nav-link.active{background:#16352b;color:var(--text)}.nav-link.active{box-shadow:inset 3px 0 var(--green)}.nav-link.active span{color:var(--green)}.sidebar-foot{margin-top:auto;padding:14px 10px 0;border-top:1px solid var(--line);color:var(--muted)}.sidebar-foot p{margin:0 0 9px;color:#c3d7cc;font-size:12px}.sidebar-foot i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);margin-right:6px}.sidebar-foot small{line-height:1.5;font-size:11px}.main-content{width:min(1450px,100%);padding:0 34px 46px;margin:0 auto}.topbar{min-height:108px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(37,65,57,.66)}.eyebrow{margin:0 0 7px;color:#89a89b;font-size:10px;letter-spacing:0}.topbar h1{margin:0;font-size:25px;letter-spacing:0}.top-status{font-size:10px;letter-spacing:0;color:#b8d5c6;border:1px solid var(--line);border-radius:40px;padding:9px 12px}.pulse{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);margin-right:7px;box-shadow:0 0 0 4px rgba(98,233,174,.1)}.view{padding-top:28px}.hero{display:flex;justify-content:space-between;gap:22px;align-items:end;margin:27px 0}.hero h2{margin:0;font-size:26px;letter-spacing:0}.hero p{margin:8px 0 0;color:var(--muted);max-width:720px;line-height:1.55}.hero-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}.button{border:1px solid transparent;border-radius:8px;padding:10px 13px;font:600 12px inherit;letter-spacing:0;cursor:pointer;color:var(--text);background:#193b30}.button:hover{filter:brightness(1.15)}.button.primary{background:var(--green);color:#082016}.button.outline{border-color:var(--line);background:transparent}.button.danger{border-color:#7a3a3a;color:#ffc0c0;background:transparent}.button:disabled{opacity:.5;cursor:not-allowed}.grid{display:grid;gap:16px}.metrics{grid-template-columns:repeat(4,minmax(0,1fr))}.compact-metrics{grid-template-columns:repeat(4,minmax(0,1fr))}.metric,.panel,.session-card{background:linear-gradient(145deg,rgba(18,42,34,.92),rgba(10,27,22,.92));border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow)}.metric{padding:18px}.metric .label{font-size:11px;color:var(--muted);letter-spacing:0}.metric .value{margin:10px 0 5px;font-size:28px;font-weight:700;letter-spacing:0}.compact-metrics .metric .value{font-size:20px}.metric .sub{font-size:11px;color:#90a99f}.metric .sub.good{color:var(--green)}.metric .sub.warning{color:var(--amber)}.panel{padding:20px}.panel-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:17px;gap:12px}.panel-title h3{margin:0;font-size:14px;letter-spacing:0}.panel-title span,.muted{color:var(--muted);font-size:11px}.two-col{grid-template-columns:minmax(0,1.6fr) minmax(300px,.9fr);margin-top:16px}.three-col{grid-template-columns:repeat(3,minmax(0,1fr));margin-top:16px}.truth-banner{padding:13px 15px;margin:-10px 0 16px;border:1px solid rgba(255,189,98,.35);border-radius:8px;background:rgba(255,189,98,.08);color:#ffe0a7;font-size:12px}.source-strip{display:grid;grid-template-columns:auto 1fr;gap:5px 10px;align-items:center;padding:12px 13px;border-radius:8px;border:1px solid rgba(108,184,255,.32);background:rgba(108,184,255,.08);margin-bottom:14px}.source-strip span{grid-row:1/3;padding:5px 8px;border-radius:8px;border:1px solid currentColor;color:#9dceff;font-size:10px}.source-strip strong{font-size:12px}.source-strip em{font-style:normal;color:var(--muted);font-size:11px;line-height:1.45}.source-strip.san{border-color:rgba(98,233,174,.28);background:rgba(98,233,174,.08)}.source-strip.san span{color:var(--green)}.source-card{border:1px solid var(--line);border-radius:8px;padding:13px;margin-bottom:10px;background:rgba(6,19,15,.38)}.source-card b{display:block;font-size:12px;margin-bottom:5px}.source-card p{margin:0;color:var(--muted);font-size:11px;line-height:1.45}.vehicle-row{display:flex;gap:13px;align-items:center;padding:13px 0;border-bottom:1px solid rgba(37,65,57,.7)}.vehicle-row:last-child{border:0}.vehicle-icon{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#244b3d;color:var(--green);font-size:19px}.vehicle-row strong{display:block;font-size:13px}.vehicle-row small{display:block;margin-top:3px;color:var(--muted)}.tag{font-size:10px;letter-spacing:0;border:1px solid var(--line);border-radius:12px;padding:4px 7px;color:#b8d3c4;white-space:nowrap}.tag.pass{border-color:#287154;color:#8bf0bf}.tag.public{border-color:#2e6793;color:#9dceff}.tag.warn{border-color:#6d572c;color:#ffcc73}.tag.critical{border-color:#7e3b3b;color:#ff9d9d}.findings{display:grid;gap:9px}.finding{padding:13px;border:1px solid var(--line);border-left:3px solid var(--blue);border-radius:7px;background:rgba(6,19,15,.4)}.finding.warning{border-left-color:var(--amber)}.finding.critical{border-left-color:var(--red)}.finding .finding-head{display:flex;justify-content:space-between;gap:8px;margin-bottom:5px}.finding strong{font-size:12px}.finding p{margin:0;color:var(--muted);font-size:11px;line-height:1.45}.empty{border:1px dashed #426456;border-radius:8px;padding:28px;text-align:center;color:var(--muted);line-height:1.55}.empty strong{display:block;color:#d0e2d7;margin-bottom:5px}.import-layout{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(290px,.8fr);gap:16px}.dropzone{display:grid;place-items:center;min-height:245px;padding:25px;text-align:center;border:1.5px dashed #477765;border-radius:8px;background:rgba(11,31,25,.45);cursor:pointer}.dropzone.drag{border-color:var(--green);background:rgba(98,233,174,.08)}.dropzone b{display:block;margin:11px 0 4px;font-size:15px}.dropzone p{color:var(--muted);margin:0;font-size:12px}.dropzone .upload-icon{font-size:30px;color:var(--green)}input[type=file]{display:none}.contract{margin:0;padding:13px;border-radius:8px;background:#06130f;border:1px solid var(--line);overflow:auto;color:#abcfbd;font:11px ui-monospace,SFMono-Regular,Consolas,monospace;line-height:1.6}.steps{list-style:none;padding:0;margin:0;display:grid;gap:11px}.steps li{display:flex;align-items:flex-start;gap:10px;color:#cadbd1;font-size:12px;line-height:1.45}.steps b{width:21px;height:21px;flex:0 0 auto;display:grid;place-items:center;border-radius:50%;background:#224b3d;color:var(--green);font-size:10px}.session-list{display:grid;gap:10px}.session-card{padding:16px;display:flex;justify-content:space-between;align-items:center;gap:14px;cursor:pointer}.session-card:hover,.session-card.selected{border-color:#5a9b7a;background:#153229}.session-card h3{margin:0 0 6px;font-size:14px}.session-card p{margin:0;color:var(--muted);font-size:11px}.session-meta{display:flex;gap:8px;align-items:center}.details-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.details-head h2{margin:0 0 5px;font-size:21px}.details-head p{margin:0;color:var(--muted);font-size:12px}.chart-wrap{height:244px;position:relative}.chart-wrap svg{width:100%;height:100%;overflow:visible}.chart-labels{position:absolute;left:0;right:0;bottom:-2px;display:flex;justify-content:space-between;color:#728d81;font-size:10px}.legend{display:flex;gap:13px;color:var(--muted);font-size:10px}.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;background:var(--green)}.legend i.temp{background:var(--amber)}.data-table{width:100%;border-collapse:collapse;font-size:11px}.data-table th{text-align:left;color:var(--muted);font-weight:500;padding:9px 8px;border-bottom:1px solid var(--line)}.data-table td{padding:10px 8px;border-bottom:1px solid rgba(37,65,57,.5);color:#d9e8df}.data-table tr:last-child td{border:0}.report-note{padding:12px;background:rgba(98,233,174,.08);border:1px solid rgba(98,233,174,.22);border-radius:8px;color:#b9d7c6;font-size:11px;line-height:1.5}.profile-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:grid;gap:5px}.field label{font-size:10px;color:var(--muted);letter-spacing:0}.field input{background:#081914;border:1px solid var(--line);border-radius:7px;padding:10px;color:var(--text);font:inherit;outline:none}.field input:focus{border-color:var(--green)}.form-actions{display:flex;gap:9px;margin-top:17px}.toast{position:fixed;right:22px;bottom:22px;padding:12px 15px;background:#17382d;border:1px solid #40795e;color:#d8eee0;border-radius:8px;box-shadow:var(--shadow);transform:translateY(90px);opacity:0;transition:.25s;font-size:12px;z-index:9}.toast.show{transform:translateY(0);opacity:1}.modal{position:fixed;inset:0;z-index:8;background:rgba(0,0,0,.63);display:grid;place-items:center;padding:20px}.modal-card{width:min(650px,100%);max-height:85vh;overflow:auto;background:#10251f;border:1px solid #3c6856;border-radius:8px;padding:22px;box-shadow:var(--shadow)}.modal-card h2{margin:0 0 9px}.modal-card p{color:var(--muted);font-size:12px;line-height:1.5}.validation{margin-top:15px}.validation ul{margin:0;padding-left:20px;color:#f5b6b6;line-height:1.7;font-size:12px}.validation.success ul{color:#a8e5c4}.modal-actions{display:flex;gap:9px;justify-content:flex-end;margin-top:18px}@media(max-width:950px){.sidebar{width:64px;padding:22px 7px}.brand{padding:0 6px 25px}.brand>span:last-child,.nav-link:not(.active)::after,.sidebar-foot{display:none}.nav-link{font-size:0;text-align:center;padding:12px 4px}.nav-link span{margin:0;font-size:20px}.metrics,.compact-metrics{grid-template-columns:repeat(2,1fr)}.two-col,.three-col,.import-layout{grid-template-columns:1fr}.main-content{padding:0 18px 34px}.top-status{display:none}}@media(max-width:580px){.metrics,.compact-metrics{grid-template-columns:1fr}.topbar{min-height:85px}.hero{display:block}.hero .button{margin-top:15px}.hero-actions{margin-top:15px;justify-content:flex-start}.profile-grid{grid-template-columns:1fr}.session-card{align-items:flex-start;flex-direction:column}.session-meta{width:100%;justify-content:space-between}}

</style>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <a class="brand" href="#command" data-nav="command">
          <span class="brand-mark">Ω</span>
          <span><strong>OCTANE</strong><em>OS</em><small>V2.1 · DIAGNOSTIC LAB</small></span>
        </a>
        <nav class="main-nav" aria-label="Primary navigation">
          <button class="nav-link active" data-nav="command"><span>⌘</span> Command Center</button>
          <button class="nav-link" data-nav="import"><span>⇪</span> Dataset Import</button>
          <button class="nav-link" data-nav="sessions"><span>◫</span> Sessions</button>
          <button class="nav-link" data-nav="vehicle"><span>◌</span> Vehicle Profile</button>
        </nav>
        <div class="sidebar-foot">
          <p><i></i> Local data vault</p>
          <small>Public data + passive telemetry.<br />No ECU or fuel-system control.</small>
        </div>
      </aside>
      <main class="main-content">
        <header class="topbar">
          <div>
            <p class="eyebrow">ASPHALT SOVEREIGN · PROJECT OCTANE Ω</p>
            <h1 id="page-title">Command Center</h1>
          </div>
          <div class="top-status"><span class="pulse"></span><span id="system-status">PUBLIC DATA ENGINE READY</span></div>
        </header>
        <section id="view" aria-live="polite"></section>
      </main>
    </div>
    <div id="toast" class="toast" role="status"></div>
    <script>
const STORE = "octaneos_v21_state";
const SAN_REQUIRED_COLUMNS = ["schema_version","device_id","vehicle_id","session_id","sample_seq","timestamp_utc","battery_v","ambient_temp_c","gps_lat","gps_lon","gps_speed_kmh","gps_fix"];
const VED_RECOMMENDED_FIELDS = [
  "DayNum",
  "VehId",
  "Trip",
  "Timestamp(ms)",
  "Latitude[deg]",
  "Longitude[deg]",
  "Vehicle Speed[km/h]",
  "Engine RPM[RPM]",
  "Outside Air Temperature[DegC]",
  "Fuel Rate[L/hr]",
  "HV Battery Voltage[V]",
  "HV Battery SOC[%]"
];
const DEFAULT_VEHICLE = {
  id: "TV001",
  name: "TV-001",
  make: "Yamaha",
  model: "R15 V2",
  year: "2015",
  fuel: "Petrol baseline pending",
  batteryLow: "12.25",
  chargingLow: "13.20",
  chargingHigh: "14.90"
};
const SOURCE_COPY = {
  san: {
    label: "SAN-V1 Native",
    status: "BENCH / VEHICLE TELEMETRY",
    badge: "SAN-V1",
    reportBoundary: "This report is generated from an OctaneOS SAN-V1 format CSV. Treat as bench evidence until the node is safely installed on TV-001 and the file is captured from the motorcycle."
  },
  ved: {
    label: "Public OBD Dataset",
    status: "PUBLIC DATA VALIDATION",
    badge: "PUBLIC",
    reportBoundary: "This report is generated from public VED-style car OBD data. It validates OctaneOS analysis logic; it is not Yamaha R15 V2 health evidence and not ethanol conversion evidence."
  }
};

let state = loadState();
let page = "command";
let selectedId = state.selectedId || null;

function loadState(){
  try {
    const parsed = JSON.parse(localStorage.getItem(STORE));
    return parsed || { vehicle: DEFAULT_VEHICLE, sessions: [] };
  } catch {
    return { vehicle: DEFAULT_VEHICLE, sessions: [] };
  }
}
function saveState(){ state.selectedId = selectedId; localStorage.setItem(STORE, JSON.stringify(state)); }
function esc(value){ return String(value ?? "").replace(/[&<>'"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;","\"":"&quot;"}[c])); }
function fmt(value, digits=1){ return Number.isFinite(value) ? Number(value).toFixed(digits) : "-"; }
function dateLabel(iso){ const d = new Date(iso); return isNaN(d) ? "Unknown time" : d.toLocaleString([], {dateStyle:"medium", timeStyle:"short"}); }
function toast(message){ const el = document.querySelector("#toast"); el.textContent = message; el.classList.add("show"); clearTimeout(window.toastTimer); window.toastTimer = setTimeout(()=>el.classList.remove("show"), 2800); }
function getSelected(){ return state.sessions.find(s => s.id === selectedId) || state.sessions[0] || null; }
function mean(a){ const b=a.filter(Number.isFinite); return b.length ? b.reduce((x,y)=>x+y,0)/b.length : NaN; }
function median(a){ const b=a.filter(Number.isFinite).sort((x,y)=>x-y); if(!b.length)return NaN; const mid=Math.floor(b.length/2); return b.length%2?b[mid]:(b[mid-1]+b[mid])/2; }
function max(a){ const b=a.filter(Number.isFinite); return b.length ? Math.max(...b) : NaN; }
function min(a){ const b=a.filter(Number.isFinite); return b.length ? Math.min(...b) : NaN; }
function haversine(a,b){ const r=Math.PI/180, R=6371; const dLat=(b.lat-a.lat)*r,dLon=(b.lon-a.lon)*r; const x=Math.sin(dLat/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dLon/2)**2; return 2*R*Math.asin(Math.sqrt(x)); }
function sourceInfo(s){ return SOURCE_COPY[s?.sourceType] || SOURCE_COPY.san; }
function nav(){
  document.querySelectorAll(".nav-link,[data-nav]").forEach(el=>el.classList.toggle("active", el.dataset.nav === page));
  document.querySelectorAll(".nav-link,[data-nav]").forEach(el=>el.onclick=()=>{ page=el.dataset.nav; render(); });
}
function render(){
  nav();
  const titles = {command:"Command Center",import:"Import Center",sessions:"Session Analysis",vehicle:"Vehicle Profile"};
  document.querySelector("#page-title").textContent = titles[page];
  document.querySelector("#view").innerHTML = page==="command"?commandView():page==="import"?importView():page==="sessions"?sessionsView():vehicleView();
  bindPage();
}

function commandView(){
  const sessions = state.sessions;
  const latest = getSelected();
  const vedCount = sessions.filter(s=>s.sourceType==="ved").length;
  const sanCount = sessions.filter(s=>s.sourceType==="san").length;
  const warnings = sessions.flatMap(s=>s.findings).filter(f=>f.severity==="warning").length;
  const critical = sessions.flatMap(s=>s.findings).filter(f=>f.severity==="critical").length;
  return `<div class="view">
    <div class="hero">
      <div>
        <h2>Public data today. SAN-V1 data next.</h2>
        <p>OctaneOS V2 can now analyze public vehicle telemetry while the R15 node is still in progress. Every report carries a source label, so Asphalt Sovereign gets software evidence without pretending it is TV-001 data.</p>
      </div>
      <button class="button primary" id="go-import">Import Dataset</button>
    </div>
    <div class="truth-banner"><strong>Current phase:</strong> Public dataset validation. Real R15 V2 evidence begins only after SAN-V1 bench logging and safe vehicle installation.</div>
    <div class="grid metrics">
      <div class="metric"><div class="label">PUBLIC DATASETS</div><div class="value">${vedCount}</div><div class="sub good">VED-style OBD imports</div></div>
      <div class="metric"><div class="label">SAN-V1 SESSIONS</div><div class="value">${sanCount}</div><div class="sub">Bench / vehicle CSV imports</div></div>
      <div class="metric"><div class="label">ACTIVE WARNINGS</div><div class="value">${warnings}</div><div class="sub ${warnings?"warning":"good"}">${warnings?"Review report findings":"No warning findings"}</div></div>
      <div class="metric"><div class="label">CRITICAL FINDINGS</div><div class="value">${critical}</div><div class="sub ${critical?"warning":"good"}">${critical?"Action required":"No critical findings"}</div></div>
    </div>
    <div class="grid two-col">
      <section class="panel">
        <div class="panel-title"><h3>Latest evidence session</h3><span>${latest?sourceInfo(latest).status:"AWAITING IMPORT"}</span></div>
        ${latest?latestSessionMarkup(latest):emptyMarkup("No telemetry has been imported", "Import the public VED demo CSV first, then test real VED/SAN-V1 files.", "Go to Import Center", "go-import")}
      </section>
      <section class="panel">
        <div class="panel-title"><h3>V2 mission gates</h3><span>TODAY</span></div>
        <ul class="steps">
          <li><b>1</b><span><strong>Public dataset adapter</strong><br />Accept VED-style car OBD logs and normalize them into OctaneOS.</span></li>
          <li><b>2</b><span><strong>Diagnostic screening report</strong><br />Reject inactive logs, then create traceable findings from speed, RPM, fuel, motion and data integrity.</span></li>
          <li><b>3</b><span><strong>SAN-V1 readiness</strong><br />Keep native SAN-V1 import available for the first bench CSV.</span></li>
        </ul>
      </section>
    </div>
    <div class="grid three-col">
      <section class="panel"><div class="panel-title"><h3>Public dataset role</h3><span>VALIDATION</span></div><p class="muted">Used to prove OctaneOS can ingest external vehicle telemetry and generate a structured report before physical bike data exists.</p></section>
      <section class="panel"><div class="panel-title"><h3>SAN-V1 role</h3><span>HARDWARE PATH</span></div><p class="muted">Will produce bench and TV-001 CSV files later using ESP32, passive voltage, temperature, GPS and future RPM/ethanol inputs.</p></section>
      <section class="panel"><div class="panel-title"><h3>Truth boundary</h3><span>IMPORTANT</span></div><p class="muted">Public car data cannot prove R15 health, ECU condition, injector behavior, ignition timing, AFR or ethanol compatibility.</p></section>
    </div>
  </div>`;
}

function emptyMarkup(title, desc, label, id){ return `<div class="empty"><strong>${title}</strong>${desc}<br /><button class="button outline" id="${id}" style="margin-top:14px">${label}</button></div>`; }
function latestSessionMarkup(s){
  const src = sourceInfo(s);
  return `<div class="source-strip ${s.sourceType}">
      <span>${src.badge}</span><strong>${src.label}</strong><em>${src.reportBoundary}</em>
    </div>
    <div class="grid metrics compact-metrics">
      <div class="metric"><div class="label">SESSION ID</div><div class="value">${esc(s.sourceSessionId)}</div><div class="sub">${s.rows.length} normalized samples</div></div>
      <div class="metric"><div class="label">DURATION / DISTANCE</div><div class="value">${duration(s.metrics.durationSec)}</div><div class="sub">${fmt(s.metrics.distanceSpeedKm,2)} km speed-integrated</div></div>
      <div class="metric"><div class="label">AVG / MAX SPEED</div><div class="value">${fmt(s.metrics.avgSpeed,1)} / ${fmt(s.metrics.maxSpeed,0)}</div><div class="sub">km/h</div></div>
      <div class="metric"><div class="label">ANALYSIS READINESS</div><div class="value">${s.metrics.quality}/100</div><div class="sub ${s.metrics.analysisReady?"good":"warning"}">${s.metrics.analysisReady?"Driving event verified":"Session not diagnostic"}</div></div>
    </div>
    <div style="margin-top:16px">
      <div class="panel-title"><h3>Latest findings</h3><button class="button outline" data-open-session="${s.id}">Open Analysis</button></div>
      ${findingsMarkup(s.findings)}
    </div>`;
}

function importView(){
  return `<div class="view">
    <div class="hero">
      <div>
        <h2>Import public vehicle data or SAN-V1 logs</h2>
        <p>OctaneOS V2 auto-detects the CSV contract. Public datasets prove software intelligence today; SAN-V1 files become the official bike evidence after bench validation.</p>
      </div>
      <div class="hero-actions">
        <button class="button outline" id="download-public-demo">Download VED-Style Demo</button>
        <button class="button outline" id="download-san-template">Download SAN-V1 Template</button>
      </div>
    </div>
    <div class="import-layout">
      <section class="panel">

function lineChart(s){
  const rows = s.rows;
  const w=720,h=210,p=15;
  const primary = s.sourceType==="ved" ? rows.map(x=>x.speed) : rows.map(x=>x.battery);
  const secondary = s.sourceType==="ved" ? rows.map(x=>x.rpm) : rows.map(x=>x.temp);
  const project = (a,minV,maxV) => a.map((v,i)=>{
    const y = Number.isFinite(v) ? h-p-(v-minV)*(h-2*p)/Math.max(maxV-minV,.001) : h-p;
    return `${p+i*(w-2*p)/Math.max(a.length-1,1)},${y}`;
  });
  const pVals = primary.filter(Number.isFinite);
  const sVals = secondary.filter(Number.isFinite);
  const first = new Date(rows[0].timestamp).toLocaleTimeString();
  const last = new Date(rows[rows.length-1].timestamp).toLocaleTimeString();
  return `<div class="chart-wrap"><svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <line x1="${p}" y1="${h-p}" x2="${w-p}" y2="${h-p}" stroke="#365b4b"/>
    <line x1="${p}" y1="${p}" x2="${p}" y2="${h-p}" stroke="#365b4b"/>
    <polyline points="${project(primary, min(pVals)-1, max(pVals)+1).join(" ")}" fill="none" stroke="#62e9ae" stroke-width="2.2" vector-effect="non-scaling-stroke"/>
    <polyline points="${project(secondary, min(sVals)-1, max(sVals)+1).join(" ")}" fill="none" stroke="#ffbd62" stroke-opacity=".76" stroke-width="1.6" vector-effect="non-scaling-stroke"/>
  </svg><div class="chart-labels"><span>${first}</span><span>${last}</span></div></div>`;
}
function findingsMarkup(findings){

    <div class="finding-head"><strong>${esc(f.title)}</strong><span class="tag ${f.severity==="info"?"pass":f.severity==="critical"?"critical":"warn"}">${esc(f.severity.toUpperCase())} · ${esc(f.confidence)}</span></div>

async function handleFile(file){
  if(!file) return;
  if(!file.name.toLowerCase().endsWith(".csv")){ toast("Only CSV files are accepted."); return; }
  const text = await file.text();
  const parsed = parseCsvTable(text);
  if(!parsed.ok){ showValidation(false, parsed.errors); return; }
  const detection = detectSource(parsed.headers);
  if(!detection.ok){ showValidation(false, detection.errors); return; }
  const normalized = detection.type === "san" ? normalizeSan(parsed) : normalizeVed(parsed);
  if(!normalized.ok){ showValidation(false, normalized.errors); return; }
  const hash = await digest(text);
  if(state.sessions.some(s=>s.hash===hash)){
    showValidation(false, ["This exact CSV was already imported. No duplicate session was created."]);
    return;
  }
  const session = buildSession(normalized.rows, hash, file.name, normalized.identity, detection.type);
  if(detection.type === "ved" && !session.metrics.analysisReady){
    showValidation(false, [
      "The CSV structure is valid, but this session is not a usable driving event.",
      `Maximum speed ${fmt(session.metrics.maxSpeed,1)} km/h; moving samples ${session.metrics.movingCount}/${session.rows.length}; maximum RPM ${fmt(session.metrics.maxRpm,0)}.`,
      `Analysis-readiness score ${session.metrics.quality}/100. OctaneOS did not store or diagnose this session.`,
      "Select a VED trip with sustained non-zero speed and RPM."
    ]);
    return;
  }
  const source = sourceInfo(session);
  showValidation(true, [
    `${source.label} detected.`,
    `${normalized.rows.length} rows normalized into the OctaneOS V2 session model.`,
    `${session.findings.length} traceable report findings generated.`,
    source.reportBoundary
  ], ()=>{
    state.sessions.unshift(session);
    selectedId = session.id;
    saveState();
    page = "sessions";
    render();
    toast("Dataset session verified and stored.");
  });
}

function parseCsvTable(text){
  const lines = text.replace(/^\uFEFF/,"").trim().split(/\r?\n/).filter(Boolean);
  if(lines.length < 3) return {ok:false, errors:["The CSV needs a header and at least two telemetry samples."]};
  const headers = parseLine(lines[0]).map(h=>h.trim());
  const records = [];
  const errors = [];
  for(let i=1;i<lines.length;i++){
    const cells = parseLine(lines[i]);
    if(cells.length !== headers.length){
      errors.push(`Row ${i+1}: expected ${headers.length} fields, received ${cells.length}.`);
      continue;
    }
    records.push(Object.fromEntries(headers.map((h,j)=>[h, cells[j].trim()])));
  }
  return errors.length ? {ok:false, errors:errors.slice(0,18)} : {ok:true, headers, records};
}
function parseLine(line){
  const out=[]; let cell="", quote=false;
  for(let i=0;i<line.length;i++){
    const ch=line[i];
    if(ch === '"'){
      if(quote && line[i+1] === '"'){ cell += '"'; i++; }
      else quote = !quote;
    } else if(ch === "," && !quote){ out.push(cell); cell = ""; }
    else cell += ch;
  }
  out.push(cell);
  return out;
}
function normKey(key){ return key.toLowerCase().replace(/[\s_\-\[\]\(\)\/%]+/g,"").replace(/[^a-z0-9]/g,""); }
function valueBy(record, aliases){
  const lookup = Object.fromEntries(Object.keys(record).map(k=>[normKey(k), record[k]]));
  for(const alias of aliases){
    const hit = lookup[normKey(alias)];
    if(hit !== undefined && hit !== "") return hit;
  }
  return "";
}
function numberValue(record, aliases){
  const raw = valueBy(record, aliases);
  if(raw === null || raw === undefined) return NaN;
  const text = String(raw).trim();
  if(!text || /^(na|nan|null|none|-)$/i.test(text)) return NaN;
  const value = Number(text);
  return Number.isFinite(value) ? value : NaN;
}
function detectSource(headers){
  const normalized = headers.map(normKey);
  const missingSan = SAN_REQUIRED_COLUMNS.filter(c=>!normalized.includes(normKey(c)));
  if(!missingSan.length) return {ok:true, type:"san"};
  const hasVedSpeed = normalized.some(h=>["vehiclespeedkmh","vehiclespeed","speedkmh"].includes(h));
  const hasVedTrip = normalized.some(h=>["vehid","vehicleid"].includes(h)) && normalized.some(h=>["trip","tripid"].includes(h));
  const hasVedTime = normalized.some(h=>["timestampms","timestamp","time"].includes(h));
  if(hasVedSpeed && hasVedTrip && hasVedTime) return {ok:true, type:"ved"};
  return {ok:false, errors:[
    "OctaneOS could not detect this CSV format.",
    `For SAN-V1, missing: ${missingSan.slice(0,8).join(", ")}${missingSan.length>8?"...":""}`,
    "For public VED-style import, include at least vehicle id, trip id, timestamp and vehicle speed columns."
  ]};
}

function normalizeSan(parsed){
  const errors = [];
  const rows = [];
  let previousTime = -Infinity, previousSeq = -Infinity, identity = null;
  parsed.records.forEach((raw, idx)=>{
    const rowNum = idx + 2;
    const timestamp = Date.parse(raw.timestamp_utc);
    const seq = Number(raw.sample_seq);
    const battery = Number(raw.battery_v);
    const temp = Number(raw.ambient_temp_c);
    const lat = Number(raw.gps_lat);
    const lon = Number(raw.gps_lon);
    const speed = Number(raw.gps_speed_kmh);
    const gpsFix = Number(raw.gps_fix);
    const rowIdentity = {schemaVersion:raw.schema_version, deviceId:raw.device_id, vehicleId:raw.vehicle_id, sourceSessionId:raw.session_id};
    if(!raw.schema_version||!raw.device_id||!raw.vehicle_id||!raw.session_id) errors.push(`Row ${rowNum}: identity fields cannot be empty.`);
    if(identity && Object.keys(rowIdentity).some(k=>rowIdentity[k]!==identity[k])) errors.push(`Row ${rowNum}: all records in one file must share schema/device/vehicle/session identity.`);
    identity ||= rowIdentity;
    validateCommon({rowNum,timestamp,seq,battery,temp,lat,lon,speed,gpsFix,previousTime,previousSeq,errors});
    previousTime = timestamp; previousSeq = seq;
    rows.push({timestamp, seq, battery, temp, lat, lon, speed, gpsFix, rpm:NaN, fuelRate:NaN, soc:NaN, source:"SAN-V1"});
  });
  return errors.length ? {ok:false, errors:errors.slice(0,18)} : {ok:true, rows, identity};
}
function validateCommon(ctx){
  const {rowNum,timestamp,seq,battery,temp,lat,lon,speed,gpsFix,previousTime,previousSeq,errors} = ctx;
  if(!Number.isFinite(timestamp)) errors.push(`Row ${rowNum}: timestamp is not valid.`);
  if(!Number.isInteger(seq) || seq < 0) errors.push(`Row ${rowNum}: sample sequence must be a non-negative integer.`);
  if(Number.isFinite(battery) && (battery < 0 || battery > 1000)) errors.push(`Row ${rowNum}: voltage value is outside the accepted 0-1000 V range.`);
  if(Number.isFinite(temp) && (temp < -50 || temp > 120)) errors.push(`Row ${rowNum}: temperature value is outside the accepted -50 to 120 C range.`);
  if(!Number.isFinite(lat) || lat < -90 || lat > 90 || !Number.isFinite(lon) || lon < -180 || lon > 180) errors.push(`Row ${rowNum}: GPS coordinates are invalid.`);
  if(!Number.isFinite(speed) || speed < 0 || speed > 280) errors.push(`Row ${rowNum}: speed must be between 0 and 280 km/h.`);
  if(![0,1].includes(gpsFix)) errors.push(`Row ${rowNum}: GPS fix must be 0 or 1.`);
  if(timestamp <= previousTime) errors.push(`Row ${rowNum}: timestamps must increase sequentially.`);
  if(seq <= previousSeq) errors.push(`Row ${rowNum}: sample sequence must increase sequentially.`);
}
function normalizeVed(parsed){
  const errors = [];
  const rows = [];
  let previousTime = -Infinity, previousSeq = -Infinity, identity = null;
  parsed.records.forEach((raw, idx)=>{
    const rowNum = idx + 2;
    const vehId = valueBy(raw, ["VehId","VehicleId","vehicle_id"]) || "PUBLIC";
    const trip = valueBy(raw, ["Trip","TripId","trip_id"]) || "TRIP";
    const dayNum = numberValue(raw, ["DayNum","Day","day_num"]);
    const timestampMs = numberValue(raw, ["Timestamp(ms)","Timestamp","Time(ms)","time_ms"]);
    const timestamp = timestampFromVed(dayNum, timestampMs, idx);
    const seq = idx + 1;
    const lat = numberValue(raw, ["Latitude[deg]","Latitude","gps_lat","lat"]);
    const lon = numberValue(raw, ["Longitude[deg]","Longitude","gps_lon","lon"]);
    const speed = numberValue(raw, ["Vehicle Speed[km/h]","Vehicle Speed","Speed[km/h]","speed_kmh"]);
    const rpm = numberValue(raw, ["Engine RPM[RPM]","Engine RPM","RPM","engine_rpm"]);
    const temp = numberValue(raw, ["Outside Air Temperature[DegC]","Outside Air Temperature","Ambient Temperature","ambient_temp_c"]);
    const fuelRate = numberValue(raw, ["Fuel Rate[L/hr]","Fuel Rate","fuel_rate_lhr"]);
    const hvVoltage = numberValue(raw, ["HV Battery Voltage[V]","Battery Voltage[V]","Battery Voltage","battery_v"]);
    const soc = numberValue(raw, ["HV Battery SOC[%]","Battery SOC[%]","SOC","soc"]);
    const gpsFix = Number.isFinite(lat) && Number.isFinite(lon) && !(lat === 0 && lon === 0) ? 1 : 0;
    const rowIdentity = {schemaVersion:"VED-public-adapter-v2.1", deviceId:"PUBLIC-VED", vehicleId:`VED-${vehId}`, sourceSessionId:`VED-${vehId}-TRIP-${trip}`};
    if(identity && Object.keys(rowIdentity).some(k=>rowIdentity[k]!==identity[k])) errors.push(`Row ${rowNum}: one public import must contain one vehicle and one trip only.`);
    identity ||= rowIdentity;
    validateCommon({rowNum,timestamp,seq,battery:hvVoltage,temp,lat,lon,speed,gpsFix,previousTime,previousSeq,errors});
    if(!gpsFix) errors.push(`Row ${rowNum}: public-data GPS coordinates are missing or 0,0.`);
    if(Number.isFinite(rpm) && (rpm < 0 || rpm > 9000)) errors.push(`Row ${rowNum}: engine RPM is outside the accepted 0-9000 range.`);
    if(Number.isFinite(fuelRate) && (fuelRate < 0 || fuelRate > 80)) errors.push(`Row ${rowNum}: fuel rate is outside the accepted 0-80 L/hr range.`);
    if(Number.isFinite(soc) && (soc < 0 || soc > 100)) errors.push(`Row ${rowNum}: SOC must be between 0 and 100%.`);
    previousTime = timestamp; previousSeq = seq;
    rows.push({timestamp, seq, battery:hvVoltage, temp, lat, lon, speed, gpsFix, rpm, fuelRate, soc, source:"VED"});
  });
  return errors.length ? {ok:false, errors:errors.slice(0,18)} : {ok:true, rows, identity};
}
function timestampFromVed(dayNum, timestampMs, index){
  const base = Date.UTC(2017,10,1,0,0,0);
  if(Number.isFinite(dayNum) && Number.isFinite(timestampMs)) return base + (dayNum - 1) * 86400000 + timestampMs;
  if(Number.isFinite(timestampMs)) return base + timestampMs;
  return base + index * 5000;
}

function buildSession(rows, hash, fileName, identity, sourceType){
  const durationSec = (rows.at(-1).timestamp - rows[0].timestamp) / 1000;
  let dist = 0, distanceSpeedKm = 0, fuelUsedL = 0, harshAccelCount = 0, harshBrakeCount = 0;
  for(let i=1;i<rows.length;i++){
    const previous = rows[i-1], current = rows[i];
    const dt = (current.timestamp - previous.timestamp) / 1000;
    if(previous.gpsFix && current.gpsFix) dist += haversine(previous, current);
    if(dt > 0 && dt <= 30){
      if(Number.isFinite(previous.speed) && Number.isFinite(current.speed)){
        distanceSpeedKm += ((previous.speed + current.speed) / 2) * dt / 3600;
        const acceleration = ((current.speed - previous.speed) / 3.6) / dt;
        if(acceleration > 2.5) harshAccelCount++;
        if(acceleration < -3.0) harshBrakeCount++;
      }
      if(Number.isFinite(previous.fuelRate) && Number.isFinite(current.fuelRate)) fuelUsedL += ((previous.fuelRate + current.fuelRate) / 2) * dt / 3600;
    }
  }
  const speedValues = rows.map(r=>r.speed);
  const rpmValues = rows.map(r=>r.rpm);
  const voltageValues = rows.map(r=>r.battery);
  const moving = rows.filter(r=>r.speed >= 5);
  const stationary = rows.filter(r=>r.speed <= 3);
  const gaps = rows.slice(1).filter((r,i)=>r.timestamp - rows[i].timestamp > 15000).length;
  const gpsCoverage = mean(rows.map(r=>r.gpsFix));
  const rpmCoverage = rows.filter(r=>Number.isFinite(r.rpm)).length / rows.length;
  const fuelCoverage = rows.filter(r=>Number.isFinite(r.fuelRate)).length / rows.length;
  const speedRange = max(speedValues) - min(speedValues);
  const activeRpmCount = rows.filter(r=>Number.isFinite(r.rpm) && r.rpm >= 600).length;
  const continuity = Math.max(0, 1 - Math.min(gaps * .05, .6));
  const publicQuality = Math.round(
    10 + 15*continuity + 10*gpsCoverage + 10*rpmCoverage + 5*fuelCoverage +
    20*(moving.length >= 10 ? 1 : 0) + 15*(activeRpmCount >= 10 ? 1 : 0) +
    10*(speedRange >= 5 ? 1 : 0) + 5*(dist >= .05 ? 1 : 0)
  );
  const sanQuality = Math.round(40 + 20*Math.max(0,1-gaps/Math.max(rows.length-1,1)) + 20*gpsCoverage + 20);
  const quality = Math.max(0, Math.min(100, sourceType === "ved" ? publicQuality : sanQuality));
  const analysisReady = sourceType !== "ved" || (
    rows.length >= 10 && moving.length >= 5 && Number.isFinite(max(speedValues)) && max(speedValues) >= 10 &&
    Number.isFinite(speedRange) && speedRange >= 5 && (rpmCoverage < .2 || activeRpmCount >= 10)
  );
  const metrics = {
    durationSec,
    distanceKm: dist,
    distanceSpeedKm,
    fuelUsedL,
    fuelEconomyL100: distanceSpeedKm >= .1 && fuelUsedL >= 0 ? fuelUsedL / distanceSpeedKm * 100 : NaN,
    minVoltage: min(voltageValues),
    maxVoltage: max(voltageValues),
    medianVoltage: median(voltageValues),
    movingVoltage: median(moving.map(r=>r.battery)),
    stationaryVoltage: median(stationary.map(r=>r.battery)),
    movingCount: moving.length,
    movingRatio: moving.length / rows.length,
    movingAvgSpeed: mean(moving.map(r=>r.speed)),
    avgSpeed: mean(speedValues),
    maxSpeed: max(speedValues),
    avgRpm: mean(rpmValues),
    maxRpm: max(rpmValues),
    idleRatio: stationary.length / rows.length,
    gpsCoverage,
    rpmCoverage,
    fuelCoverage,
    avgFuelRate: mean(rows.map(r=>r.fuelRate)),
    speedRange,
    activeRpmCount,
    highRpmRatio: rows.filter(r=>Number.isFinite(r.rpm) && r.rpm > 4000).length / rows.length,
    harshAccelCount,
    harshBrakeCount,
    largeGaps: gaps,
    quality,
    analysisReady
  };
  const s = {id:"OS2-"+Date.now().toString(36), sourceType, ...identity, fileName, hash, rows, metrics, importedAt:new Date().toISOString(), startTime:new Date(rows[0].timestamp).toISOString(), findings:[]};
  s.findings = sourceType === "ved" ? runVedRules(s) : runSanRules(s);
  return s;
}
function runVedRules(s){
  const f=[], m=s.metrics;
  if(!m.analysisReady){
    f.push({severity:"critical",confidence:"High",title:"Session rejected for diagnostic analysis",evidence:`Maximum speed ${fmt(m.maxSpeed,1)} km/h, moving samples ${m.movingCount}/${s.rows.length}, maximum RPM ${fmt(m.maxRpm,0)} and speed range ${fmt(m.speedRange,1)} km/h. The signals do not demonstrate a usable driving event.`,action:"Select a different VED vehicle-trip containing sustained non-zero speed and engine RPM. Do not present this session as a health result."});
    return f;
  }
  if(m.quality >= 80) f.push({severity:"info",confidence:"High",title:"Session passed telemetry-analysis gate",evidence:`${s.rows.length} samples, ${Math.round(m.movingRatio*100)}% moving coverage, ${Math.round(m.gpsCoverage*100)}% GPS coverage and analysis-readiness score ${m.quality}/100.`,action:"Use as public-data software evidence only; retain the source hash and report limitations."});
  else f.push({severity:"warning",confidence:"High",title:"Session usable with data-quality limitations",evidence:`Analysis-readiness score is ${m.quality}/100 with ${m.largeGaps} timing gaps.`,action:"Compare against another clean trip before drawing operational conclusions."});
  if(m.maxSpeed > 110) f.push({severity:"warning",confidence:"Medium",title:"High-speed operation observed",evidence:`Maximum speed reached ${fmt(m.maxSpeed,1)} km/h.`,action:"Review whether the trip represents highway driving before comparing it with city/bike operation."});
  if(m.idleRatio > 0.35) f.push({severity:"warning",confidence:"Medium",title:"High stop/idle ratio",evidence:`${fmt(m.idleRatio*100,0)}% of samples were below 3 km/h.`,action:"Flag as congestion/idle-heavy trip; expect higher fuel/energy stress."});
  if(Number.isFinite(m.maxRpm) && m.maxRpm > 4500) f.push({severity:"warning",confidence:"Medium",title:"High RPM band reached",evidence:`Maximum engine speed reached ${fmt(m.maxRpm,0)} RPM.`,action:"Use only as operational behavior evidence unless vehicle-specific redline and load are known."});
  if(m.fuelCoverage > .5 && Number.isFinite(m.avgFuelRate) && m.avgFuelRate > 6) f.push({severity:"warning",confidence:"Low",title:"Elevated average fuel-rate period",evidence:`Average available fuel-rate was ${fmt(m.avgFuelRate,2)} L/hr.`,action:"Correlate with road type, speed, stops and engine load before inferring inefficiency."});
  if(m.harshAccelCount >= 3) f.push({severity:"warning",confidence:"Medium",title:"Repeated rapid-acceleration events",evidence:`${m.harshAccelCount} intervals exceeded 2.5 m/s².`,action:"Review the speed trace and sampling continuity; repeated events may indicate aggressive operation."});
  if(m.harshBrakeCount >= 3) f.push({severity:"warning",confidence:"Medium",title:"Repeated rapid-deceleration events",evidence:`${m.harshBrakeCount} intervals were below -3.0 m/s².`,action:"Review for abrupt braking or noisy speed samples before interpreting driver behaviour."});
  if(!f.some(x=>x.severity!=="info")) f.push({severity:"info",confidence:"Low",title:"No public-data rule thresholds triggered",evidence:"This does not clear a vehicle as healthy; it only means the V2 public-data rules did not flag this trip.",action:"Import more trips to compare patterns."});
  return f;
}
function runSanRules(s){
  const f=[],m=s.metrics,v=state.vehicle;
  const low=Number(v.batteryLow), chargeLow=Number(v.chargingLow), chargeHigh=Number(v.chargingHigh);
  if(m.gpsCoverage < .8) f.push({severity:"warning",confidence:"Medium",title:"Reduced GPS evidence coverage",evidence:`Only ${Math.round(m.gpsCoverage*100)}% of samples carry a valid GPS fix.`,action:"Check NEO-6M antenna placement and sky visibility."});
  else f.push({severity:"info",confidence:"High",title:"Telemetry evidence passed quality gate",evidence:`${s.rows.length} samples, ${Math.round(m.gpsCoverage*100)}% GPS coverage and a quality score of ${m.quality}/100.`,action:"Use this session for baseline comparison."});
  if(m.largeGaps) f.push({severity:"warning",confidence:"High",title:"Telemetry timing gaps detected",evidence:`${m.largeGaps} intervals exceeded 15 seconds.`,action:"Inspect SD write cycle, power stability and GPS serial handling."});
  if(Number.isFinite(m.stationaryVoltage)&&m.stationaryVoltage<low) f.push({severity:m.stationaryVoltage<11.9?"critical":"warning",confidence:"Medium",title:"Possible low battery state",evidence:`Stationary median voltage was ${fmt(m.stationaryVoltage,2)} V; vehicle profile threshold is ${fmt(low,2)} V.`,action:"Confirm with a calibrated multimeter after rest; inspect battery and terminals."});
  if(m.movingCount>=5&&Number.isFinite(m.movingVoltage)&&m.movingVoltage<chargeLow) f.push({severity:"warning",confidence:"Medium",title:"Possible under-voltage during movement",evidence:`Movement-proxy median voltage was ${fmt(m.movingVoltage,2)} V across ${m.movingCount} samples; configured threshold is ${fmt(chargeLow,2)} V.`,action:"Confirm charging system performance with a multimeter under controlled engine-running conditions."});
  if(m.movingCount>=5&&Number.isFinite(m.movingVoltage)&&m.movingVoltage>chargeHigh) f.push({severity:"critical",confidence:"Medium",title:"Possible charging over-voltage",evidence:`Movement-proxy median voltage was ${fmt(m.movingVoltage,2)} V; configured ceiling is ${fmt(chargeHigh,2)} V.`,action:"Inspect regulator/rectifier output with a qualified technician."});
  if(Number.isFinite(m.maxVoltage)&&Number.isFinite(m.minVoltage)&&m.maxVoltage-m.minVoltage>1.2) f.push({severity:"warning",confidence:"Low",title:"Wide voltage swing observed",evidence:`Voltage range was ${fmt(m.minVoltage,2)}-${fmt(m.maxVoltage,2)} V (${fmt(m.maxVoltage-m.minVoltage,2)} V spread).`,action:"Correlate with ignition/start events before concluding a fault."});
  return f;
}

async function digest(text){
  const data = new TextEncoder().encode(text);
  const hash = await crypto.subtle.digest("SHA-256", data);
  return [...new Uint8Array(hash)].map(b=>b.toString(16).padStart(2,"0")).join("");
}
function duration(sec){
  if(!Number.isFinite(sec)) return "-";
  const h=Math.floor(sec/3600), m=Math.floor((sec%3600)/60), s=Math.round(sec%60);
  return h ? `${h}h ${m}m` : `${m}m ${s}s`;
}
function showValidation(success, items, onContinue){
  const box = document.createElement("div");
  box.className = "modal";
  box.innerHTML = `<div class="modal-card"><h2>${success?"CSV validated":"Import blocked"}</h2><p>${success?"The file has been normalized and is ready to store as an OctaneOS V2 session.":"No data was imported. Correct the listed issues, then try again."}</p><div class="validation ${success?"success":""}"><ul>${items.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div><div class="modal-actions">${success?`<button class="button primary" id="confirm-import">Store verified session</button>`:""}<button class="button outline" id="close-modal">Close</button></div></div>`;
  document.body.append(box);
  box.querySelector("#close-modal").onclick = () => box.remove();
  box.querySelector("#confirm-import")?.addEventListener("click",()=>{ box.remove(); onContinue?.(); });
}
