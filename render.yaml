services:
  - type: web
    name: octaneos-sentinel-workshop-beta
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/ready
    envVars:
      - key: OCTANE_ENV
        value: production
      - key: OCTANE_DEMO
        value: '0'
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: OCTANE_AI_PROVIDER
        value: none
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OCTANE_AI_MODEL
        sync: false
